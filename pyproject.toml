[project]
name = "fusion"
version = "0.1.0"
description = "Integration utilities for Nuvolo and ArcGIS synchronization"
authors = [
    {name = "Fusion Integration Bot"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
